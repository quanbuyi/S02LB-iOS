name: S02LB
options:
  bundleIdPrefix: com.s02lb
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.4"
targets:
  S02LB:
    type: application
    platform: iOS
    sources:
      - path: S02LB/App
      - path: S02LB/Core
      - path: S02LB/Modules
    info:
      path: S02LB/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.s02lb.app
        INFOPLIST_FILE: S02LB/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        SWIFT_VERSION: "5.0"
