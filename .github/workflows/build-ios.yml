name: Build S02LB iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Determine Project Directory
        id: dir
        run: |
          if [ -f "project.yml" ]; then
            echo "path=." >> $GITHUB_OUTPUT
          elif [ -f "ios/project.yml" ]; then
            echo "path=ios" >> $GITHUB_OUTPUT
          else
            echo "project.yml not found!" && exit 1
          fi

      - name: Generate Xcode Project
        working-directory: ${{ steps.dir.outputs.path }}
        run: |
          xcodegen generate
          python3 -c "
          import re
          p = 'S02LB.xcodeproj/project.pbxproj'
          with open(p, 'r') as f:
              c = f.read()
          c = re.sub(r'objectVersion = \d+;', 'objectVersion = 60;', c)
          with open(p, 'w') as f:
              f.write(c)
          print('Successfully patched objectVersion to 60 for Xcode 15.4 compatibility')
          "

      - name: Build iOS Application (.app)
        working-directory: ${{ steps.dir.outputs.path }}
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project S02LB.xcodeproj \
            -scheme S02LB \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS="" 2>&1 | tee build.log || true

          if grep -q "BUILD FAILED" build.log; then
            echo ""
            echo "====================== 编译错误汇总 ======================"
            grep -E "(: error:|error: )" build.log || true
            echo "=========================================================="
            exit 1
          fi

      - name: Package into IPA
        working-directory: ${{ steps.dir.outputs.path }}
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "S02LB.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: S02LB.app not found!"
            find build
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/

          # 注入 Entitlements 描述，保障重签名工具 (如 TrollStore / AltStore) 能正确授予 HotspotConfiguration 权限
          cp S02LB/Resources/S02LB.entitlements Payload/S02LB.app/archived-expanded-entitlements.xcent || true

          # 强制注入蓝牙与外设访问隐私描述，避免任何构建器重写导致缺失崩溃
          PLIST="Payload/S02LB.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :NSBluetoothAlwaysUsageDescription 'S02LB App 需要使用蓝牙扫描、连接并控制智能眼镜设备，下发拍照录像与配置指令。'" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'S02LB App 需要使用蓝牙扫描、连接并控制智能眼镜设备，下发拍照录像与配置指令。'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSBluetoothPeripheralUsageDescription 'S02LB App 需要使用低功耗蓝牙与智能眼镜进行控制指令与状态交互。'" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'S02LB App 需要使用低功耗蓝牙与智能眼镜进行控制指令与状态交互。'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSLocalNetworkUsageDescription 'S02LB App 需要访问本地网络以连接智能眼镜 WiFi 热点，实现低延迟实时视频流预览及媒体文件下载。'" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'S02LB App 需要访问本地网络以连接智能眼镜 WiFi 热点，实现低延迟实时视频流预览及媒体文件下载。'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'S02LB App 需要将从眼镜下载的高清照片与录像保存到系统相册中。'" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'S02LB App 需要将从眼镜下载的高清照片与录像保存到系统相册中。'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'S02LB App 需要访问系统相册以保存并管理从智能眼镜导出的照片与视频。'" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'S02LB App 需要访问系统相册以保存并管理从智能眼镜导出的照片与视频。'" "$PLIST"

          echo "====================== 验证打包后的 Info.plist ======================"
          plutil -p "$PLIST"
          echo "===================================================================="

          zip -r S02LB.ipa Payload
          echo "IPA created successfully"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S02LB-iOS-IPA
          path: ${{ steps.dir.outputs.path }}/S02LB.ipa
          retention-days: 7
